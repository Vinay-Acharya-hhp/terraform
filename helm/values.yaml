  cart-service:         { image: cart,        port: 8083, enabled: false, useConfig: true, dbUrlKey: DB_URL_CART }
  order-service:        { image: order,       port: 8084, enabled: false, useConfig: true, dbUrlKey: DB_URL_ORDER }
  payment-service:      { image: payment,     port: 8085, enabled: false, useConfig: true, dbUrlKey: DB_URL_PAYMENT }
